# Medical Chatbot Configuration File
# 医疗问答系统配置文件

# Neo4j 知识图谱数据库配置
neo4j:
  host: "172.24.30.243"
  http_port: 7474
  bolt_port: 7687
  user: "neo4j"
  password: "12345"
  max_connections: 10

# 模型配置
model:
  # GPU配置
  gpu_memory_fraction: 0.3
  allow_soft_placement: true
  log_device_placement: false
  
  # NER模型配置
  ner:
    model_path: "./data_ai/nerModel/"
    word_embedding_path: "./data_ai/cbowData/document.txt.ebd.npy"
    vocab_path: "./data_ai/cbowData/document.txt.vab"
    train_data_path: "./data_ai/nerData/train_cutword_data.txt"
    train_label_path: "./data_ai/nerData/label_cutword_data.txt"
    test_data_path: "./data_ai/nerData/test_data.txt"
    test_label_path: "./data_ai/nerData/test_label.txt"
    batch_size: 100
    hidden_size: 650
    sentence_length: 25
    tag_nums: 31
    dropout_rate: 0.5
    
  # 分类模型配置
  classifier:
    model_path: "./data_ai/classifyModel"
    word_embedding_path: "./data_ai/cbowData/classifyDocument.txt.ebd.npy"
    vocab_path: "./data_ai/cbowData/classifyDocument.txt.vab"
    max_sentence_len: 20
    embedding_dim: 200
    num_classes: 18
    filter_sizes: [2, 3, 4]
    num_filters: 128
    dropout_rate: 0.5
    l2_reg_lambda: 0.0

# 问答系统配置
chatbot:
  # 回答数量限制
  answer_limit: 20
  # 默认回复
  default_answer: "您的问题我还不能理解，请换个问法"
  # 多轮对话配置
  dialogue:
    enable_context: true
    max_context_turns: 5
    context_timeout: 300  # 5分钟超时

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/chatbot.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# 实体类型映射
entity_types:
  dis: "disease"
  sym: "symptom"
  dru: "drug"
  dep: "department"
  chk: "check"
  fod: "food"
  bdy: "body_part"
  sur: "surgery"
  ins: "insurance"
  prd: "producer"

# 问句类型标签
question_labels:
  0: "disease_symptom"
  1: "symptom_curway"
  2: "symptom_disease"
  3: "disease_drug"
  4: "drug_disease"
  5: "disease_check"
  6: "disease_prevent"
  7: "disease_lasttime"
  8: "disease_cureway"
  9: "disease_cause"
  10: "disease_acompany"
  11: "disease_desc"
  12: "drug_side_effect"
  13: "drug_usage"
  14: "department_recommend"
  15: "disease_body_part"
  16: "disease_surgery"
  17: "disease_insurance"
